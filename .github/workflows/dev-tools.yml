# TEMPORAL: genera las carpetas de plataforma (android/, ios/), formatea el código y
# sube el resultado a la rama. Se elimina antes de fusionar el PR.
name: Herramientas (temporal)

on:
  push:
    branches: [feature/app-tareas]

permissions:
  contents: write

concurrency:
  group: dev-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generar, formatear e informar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: echo "::notice title=flutter::$(flutter --version | head -1)"

      - name: Generar carpetas de plataforma que falten
        run: |
          had_test=$(test -f test/widget_test.dart && echo yes || echo no)
          flutter create --org com.dvilla0898 --project-name ws_movil --platforms=android,ios .
          if [ "$had_test" = "no" ]; then rm -f test/widget_test.dart; fi

      - name: Dependencias
        run: |
          flutter pub get > pub.txt 2>&1 || { echo "::error title=pub get::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' pub.txt)"; exit 1; }

      - name: Formatear
        run: dart format .

      - name: Subir cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q pub.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: archivos generados por flutter create y dart format"
            git push
          fi

      - name: Informe de análisis y tests
        if: always()
        run: |
          flutter analyze > analyze.txt 2>&1 && a=0 || a=1
          flutter test > test.txt 2>&1 && t=0 || t=1
          enc() { tail -c 30000 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=analyze (exit $a)::$(enc analyze.txt)"
          echo "::warning title=test (exit $t)::$(enc test.txt)"
