name: ws_movil
description: "Lista de tareas (to-do) de aprendizaje con Flutter, Bloc/Cubit, SQLite y arquitectura hexagonal."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Traducciones de los widgets de Material (calendario, botones del sistema...).
  flutter_localizations:
    sdk: flutter
  # Gestión de estado con Cubit + widgets BlocProvider/BlocBuilder.
  flutter_bloc: ^9.1.0
  # Comparación por valor (útil en estados y entidades).
  equatable: ^2.0.7
  # SQLite en Android/iOS.
  sqflite: ^2.4.2
  path: ^1.9.0
  # Hash SHA-256 para no guardar contraseñas en texto plano.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite en el ordenador (para los tests de los repositorios).
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
